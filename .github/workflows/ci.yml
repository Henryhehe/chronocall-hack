name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run check
      - name: Build deployment image
        run: docker build -t chronocall-ci .
      - name: Start deployment image in demo mode
        run: docker run -d --name chronocall-ci -p 127.0.0.1:3000:3000 -e DEMO_MODE=true chronocall-ci
      - name: Check container HTTP, assets, and WebSocket
        run: node scripts/smoke.mjs http://127.0.0.1:3000 --demo
      - name: Show container logs
        if: always()
        run: docker logs chronocall-ci || true
      - name: Stop deployment image
        if: always()
        run: docker rm -f chronocall-ci || true
